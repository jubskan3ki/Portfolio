- hosts: portfolio
  name: Rotate sops age key
  tasks:
      - name: Overwrite age key
        copy:
            content: "{{ sops_age_key }}"
            dest: "{{ sops_age_key_path }}"
            mode: "0600"
            owner: "{{ app_system_user }}"
            group: "{{ app_system_user }}"

      - name: Pull updated secrets
        git:
            repo: "{{ git_repo }}"
            dest: "{{ deploy_path }}"
            version: "{{ git_branch }}"
            force: yes
        become_user: "{{ app_system_user }}"

      - name: Re-decrypt and restart
        command:
            cmd: "make secrets-decrypt ENV={{ deployment_env }}"
            chdir: "{{ deploy_path }}"
        become_user: "{{ app_system_user }}"

      - name: Restart service to pick up new secrets
        systemd:
            name: "{{ app_systemd_service }}"
            state: restarted
