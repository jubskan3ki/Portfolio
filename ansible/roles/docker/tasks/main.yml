---
# Install Docker CE from upstream repo + compose plugin + buildx.
- name: Docker apt keyring dir
  file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

- name: Add Docker GPG key
  apt_key:
      url: https://download.docker.com/linux/debian/gpg
      keyring: /etc/apt/keyrings/docker.gpg
      state: present

- name: Add Docker APT repo
  apt_repository:
      repo: "deb [arch={{ ansible_architecture | regex_replace('^x86_64$', 'amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
      state: present
      filename: docker

- name: Install Docker packages
  apt:
      name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
      state: present
      update_cache: yes

- name: Docker daemon config
  copy:
      dest: /etc/docker/daemon.json
      mode: "0644"
      content: "{{ docker_daemon_config | to_nice_json }}"
  notify: restart docker

- name: Ensure docker service running
  systemd:
      name: docker
      enabled: yes
      state: started

- name: Add deploy user to docker group
  user:
      name: "{{ app_system_user }}"
      groups: docker
      append: yes
