---
# Production inventory. Secrets (IPs, SSH keys) go in group_vars/all/vault.yml
# (ansible-vault encrypted). The host var below is a placeholder.

all:
    children:
        portfolio:
            hosts:
                prod:
                    ansible_host: "{{ vault_prod_ansible_host }}"
                    ansible_port: "{{ vault_ssh_port | default(2200) }}"
                    ansible_user: "{{ vault_ansible_user | default('portfolio') }}"
            vars:
                deployment_env: prod
                deploy_domain: "{{ vault_deploy_domain }}"
                deploy_path: /srv/portfolio
                git_repo: "{{ vault_git_repo }}"
                git_branch: main
                sops_age_key: "{{ vault_sops_age_key }}"
                discord_webhook_url: "{{ vault_discord_webhook_url }}"
