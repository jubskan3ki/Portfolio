x-common-env: &common-env
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_SETTINGS_MODULE: config.settings
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    SMTP_HOST: ${SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT}
    SMTP_USER: ${SMTP_USER}
    SMTP_PASS: ${SMTP_PASS}
    EMAIL_FROM: ${EMAIL_FROM}
    ADMIN_EMAIL: ${ADMIN_EMAIL}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    JWT_SECRET_ACCESS_KEY: ${JWT_SECRET_ACCESS_KEY}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-celery_user}:${RABBITMQ_PASS:-celery_password}@rabbitmq:5672/
    REDIS_URL: redis://redis:6379/0

x-logging: &default-logging
    driver: json-file
    options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

services:
    db:
        image: postgres:${POSTGRES_VERSION:-17.4}-alpine
        container_name: postgres-db
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - portfolio_db:/var/lib/postgresql
        networks:
            - portfolio_net
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    pgbouncer:
        image: edoburu/pgbouncer:latest
        container_name: pgbouncer
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
            DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
            MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-100}
            MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
            AUTH_TYPE: scram-sha-256
        ports:
            - "${PGBOUNCER_PORT:-6432}:5432"
        networks:
            - portfolio_net
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: redis:${REDIS_VERSION:-7.4}-alpine
        container_name: redis
        command: >
            redis-server
            --appendonly yes
            --maxmemory ${REDIS_MAXMEMORY:-256mb}
            --maxmemory-policy allkeys-lru
            --timeout 0
            --loglevel warning
            --protected-mode no
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        networks:
            - portfolio_net
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

    rabbitmq:
        image: rabbitmq:${RABBITMQ_VERSION:-4}-management-alpine
        container_name: rabbitmq
        hostname: rabbitmq
        ports:
            - "${RABBITMQ_PORT:-5672}:5672"
            - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-celery_user}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-celery_password}
            RABBITMQ_DEFAULT_VHOST: /
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        networks:
            - portfolio_net
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # Application Services
    backend:
        container_name: django-api
        build:
            context: ./apps/server
            dockerfile: Dockerfile
            args:
                PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        volumes:
            - ./apps/server:/app
            - backend_logs:/app/logs
            - backend_static:/app/staticfiles
            - backend_media:/app/media
            - backend_swagger:/app/swagger
        ports:
            - "${SERVER_PORT:-8000}:8000"
        depends_on:
            db:
                condition: service_healthy
            pgbouncer:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped
        logging: *default-logging
        environment:
            <<: *common-env
            DB_HOST: pgbouncer
            DB_PORT: "5432"
            USE_PGBOUNCER: "true"
            SERVER_PORT: ${SERVER_PORT:-8000}
            GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
            GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
        healthcheck:
            test: ["CMD-SHELL", "python manage.py healthcheck || exit 1"]
            interval: 30s
            retries: 3
            timeout: 10s
            start_period: 60s

    celery:
        container_name: celery-worker
        build:
            context: ./apps/server
            dockerfile: Dockerfile
            args:
                PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
        command: >
            celery -A config worker
            --loglevel=${CELERY_LOG_LEVEL:-INFO}
            --concurrency=${CELERY_CONCURRENCY:-2}
            --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-1000}
        volumes:
            - ./apps/server:/app
            - backend_logs:/app/logs
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped
        logging: *default-logging
        environment:
            <<: *common-env
            DB_HOST: pgbouncer
            DB_PORT: "5432"
            USE_PGBOUNCER: "true"
        healthcheck:
            test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
            interval: 60s
            timeout: 15s
            retries: 3
            start_period: 60s

    frontend:
        container_name: nuxt-app
        build:
            context: ./apps/client
            dockerfile: Dockerfile
            args:
                NODE_VERSION: ${NODE_VERSION:-24}
                PNPM_VERSION: ${PNPM_VERSION:-10.28.0}
                NUXT_API_BASE_SERVER: ${NUXT_API_BASE_SERVER:-http://backend:8000}
                NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
        ports:
            - "${FRONTEND_PORT:-3000}:80"
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped
        environment:
            NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:${SERVER_PORT:-8000}}
            NUXT_API_BASE_SERVER: ${NUXT_API_BASE_SERVER:-http://backend:8000}
            NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
            NUXT_PUBLIC_WEB_VITALS_SAMPLE_RATE: ${NUXT_PUBLIC_WEB_VITALS_SAMPLE_RATE:-0.2}
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
            interval: 30s
            retries: 3
            timeout: 5s
            start_period: 30s

    # Reverse proxy
    nginx:
        image: nginx:${NGINX_VERSION:-1.27}-alpine
        container_name: nginx-proxy
        ports:
            - "${NGINX_PORT:-80}:80"
        volumes:
            - ./nginx/main-nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - backend_static:/app/staticfiles:ro
            - backend_media:/app/media:ro
        depends_on:
            backend:
                condition: service_healthy
            frontend:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped
        logging: *default-logging
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
            interval: 30s
            retries: 3
            timeout: 5s
            start_period: 10s

    # Dev Tools
    swagger:
        image: swaggerapi/swagger-ui:latest
        container_name: swagger-ui
        profiles: ["dev"]
        environment:
            API_URL: http://localhost:${SERVER_PORT:-8000}/api/schema/
            SWAGGER_JSON: /app/openapi.json
        ports:
            - "${SWAGGER_PORT:-8085}:8080"
        volumes:
            - backend_swagger:/app:ro
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: pgadmin
        profiles: ["dev"]
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@portfolio.dev}
            PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
            PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
            PGADMIN_CONFIG_SERVER_MODE: "False"
        ports:
            - "${PGADMIN_PORT:-5050}:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        depends_on:
            db:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped

    # Monitoring
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        profiles: ["monitoring"]
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-${ADMIN_EMAIL}}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${ADMIN_PASSWORD}}
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
            GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
        ports:
            - "${GRAFANA_PORT:-3001}:3000"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
        networks:
            - portfolio_net
        restart: unless-stopped
        depends_on:
            - prometheus
            - loki
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        profiles: ["monitoring"]
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
        ports:
            - "${PROMETHEUS_PORT:-9090}:9090"
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        networks:
            - portfolio_net
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3

    loki:
        image: grafana/loki:latest
        container_name: loki
        profiles: ["monitoring"]
        ports:
            - "${LOKI_PORT:-3100}:3100"
        command: -config.file=/etc/loki/local-config.yaml
        volumes:
            - ./monitoring/local-config.yaml:/etc/loki/local-config.yaml:ro
            - loki_data:/loki
        networks:
            - portfolio_net
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "/usr/bin/loki", "-version"]
            interval: 30s
            timeout: 10s
            retries: 3

    promtail:
        image: grafana/promtail:latest
        container_name: promtail
        profiles: ["monitoring"]
        volumes:
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
            - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
        command: -config.file=/etc/promtail/config.yml
        networks:
            - portfolio_net
        restart: unless-stopped
        depends_on:
            - loki

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: cadvisor
        profiles: ["monitoring"]
        ports:
            - "${CADVISOR_PORT:-8080}:8080"
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:rw
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
        networks:
            - portfolio_net
        restart: unless-stopped

    # Backup
    db-backup:
        image: prodrigestivill/postgres-backup-local:latest
        container_name: db-backup
        profiles: ["backup"]
        volumes:
            - ${BACKUP_PATH:-./backups}:/backups
        environment:
            POSTGRES_HOST: db
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
            BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
            BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
            BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
        networks:
            - portfolio_net
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy

volumes:
    portfolio_db:
    grafana_data:
    prometheus_data:
    loki_data:
    redis_data:
    rabbitmq_data:
    backend_logs:
    backend_static:
    backend_media:
    backend_swagger:
    pgadmin_data:

networks:
    portfolio_net:
        driver: bridge
