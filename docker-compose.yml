services:
    db:
        image: postgres:latest
        container_name: postgres-db
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - portfolio_db:/var/lib/postgresql/data
        networks:
            - portfolio_net
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    backend:
        container_name: django-api
        build:
            context: ./apps/server
            dockerfile: Dockerfile
        volumes:
            - ./apps/server:/app
        ports:
            - "${SERVER_PORT}:8000"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped
        environment:
            SERVER_PORT: ${SERVER_PORT}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            API_BASE_URL: ${API_BASE_URL}
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASS: ${SMTP_PASS}
            EMAIL_FROM: ${EMAIL_FROM}
            ADMIN_EMAIL: ${ADMIN_EMAIL}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD}
            JWT_SECRET_ACCESS_KEY: ${JWT_SECRET_ACCESS_KEY}
            CELERY_BROKER_URL: amqp://${ADMIN_EMAIL}:${ADMIN_PASSWORD}@rabbitmq:5672//
        healthcheck:
            test: ["CMD-SHELL", "curl --fail http://localhost:8000 || exit 1"]
            interval: 10s
            retries: 5
            timeout: 5s
            start_period: 10s

    frontend:
        container_name: nuxt-app
        build:
            context: ./apps/client
            dockerfile: Dockerfile
        ports:
            - "${FRONTEND_PORT}:80"
        networks:
            - portfolio_net
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "curl --fail http://localhost:80 || exit 1"]
            interval: 10s
            retries: 3
            timeout: 5s
            start_period: 10s

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${ADMIN_PASSWORD}
            CSRF_PROTECT: "False"
        ports:
            - "5050:80"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - portfolio_net
        restart: unless-stopped

    celery:
        build:
            context: ./apps/server
            dockerfile: Dockerfile
        container_name: celery
        command: celery -A config worker --loglevel=info
        user: "1000:1000"
        volumes:
            - ./apps/server:/app
        depends_on:
            - backend
            - rabbitmq
        environment:
            CELERY_BROKER_URL: amqp://${ADMIN_EMAIL}:${ADMIN_PASSWORD}@rabbitmq:5672//
        networks:
            - portfolio_net
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${ADMIN_EMAIL}
            RABBITMQ_DEFAULT_PASS: ${ADMIN_PASSWORD}
        networks:
            - portfolio_net
        restart: unless-stopped

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3001:3000"
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - portfolio_net
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./monitoring/prometheus.yml:/etc/monitoring/prometheus.yml
            - prometheus_data:/prometheus
        networks:
            - portfolio_net
        restart: unless-stopped

    node-exporter:
        image: prom/node-exporter:latest
        container_name: node-exporter
        ports:
            - "9100:9100"
        networks:
            - portfolio_net
        restart: unless-stopped

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: cadvisor
        ports:
            - "8080:8080"
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:rw
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
        networks:
            - portfolio_net
        restart: unless-stopped

    db-backup:
        image: prodrigestivill/postgres-backup-local
        container_name: db-backup
        volumes:
            - ./backups:/backups
        environment:
            POSTGRES_HOST: ${DB_HOST}
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            SCHEDULE: "@daily"
        networks:
            - portfolio_net

volumes:
    portfolio_db:
    grafana_data:
    prometheus_data:

networks:
    portfolio_net:
        driver: bridge
