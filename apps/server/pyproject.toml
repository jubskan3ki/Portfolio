# 📌 Black Configuration (Formatage du code Python)
[tool.black]
line-length = 120
target-version = ["py311"]
skip-string-normalization = false
include = "\\.pyi?$"
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | env
    | venv
    | __pycache__
    | _build
    | buck-out
    | build
    | dist
    | migrations
    | staticfiles
    | media
    | pyproject.toml
)/
'''

# 🔄 isort (Organisation des imports)
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
known_django = "django"
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "THIRDPARTY"
skip = [
    "migrations",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "staticfiles",
    "media",
]

# ✅ Pylint (Linter pour Python)
[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "invalid-name",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "import-error",
    "no-member",
    "fixme",
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.master]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings"

[tool.pylint.similarities]
ignore-imports = true

# 📝 Flake8 (Contrôle qualité du code Python)
[tool.flake8]
max-line-length = 88
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "migrations",
    "staticfiles",
    "media",
]
ignore = [
    "E203",
    "W503",
    "E266",
    "E501",
    "B905",
    "D100",
    "D104",
]
select = ["E", "F", "W", "B", "C", "D"]
per-file-ignores = [
    "__init__.py:F401"
]

# 🔨 Configuration du système de build
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
