<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>🤝 Merci pour votre message</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            font-family: Lato, Roboto, sans-serif;
        "
    >
        <table
            align="center"
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
                background-color: #ffffff;
                border-radius: 12px;
                border: 2px solid #e0e0e0;
            "
        >
            <tr>
                <td style="padding: 40px; text-align: center">
                    <h1
                        style="
                            color: #4caf50;
                            font-size: 26px;
                            margin-bottom: 20px;
                        "
                    >
                        🤝 Merci, {{ name }} !
                    </h1>

                    <p style="font-size: 16px; color: #333333">
                        Votre message a bien été reçu.
                    </p>
                    <p style="font-size: 16px; color: #333333">
                        Je vous répondrai dans les plus brefs délais.
                    </p>

                    <div style="margin-top: 24px">
                        <a
                            href="https://aitaddajuba.fr"
                            style="
                                background-color: #4caf50;
                                color: #ffffff;
                                text-decoration: none;
                                padding: 12px 28px;
                                border-radius: 6px;
                                font-weight: bold;
                                display: inline-block;
                            "
                        >
                            Retourner sur le site
                        </a>
                    </div>

                    <hr
                        style="
                            margin: 40px 0;
                            border: none;
                            border-top: 1px solid #e0e0e0;
                        "
                    />

                    <footer
                        style="
                            text-align: center;
                            font-size: 12px;
                            color: #999999;
                        "
                    >
                        <p>
                            Ce message est automatique. Ne pas y répondre
                            directement.
                        </p>
                        <p>© {{ year }} Juba Aitadda. Tous droits réservés.</p>
                        <p>
                            <a
                                href="https://aitaddajuba.fr/politique-confidentialite"
                                style="color: #4caf50"
                                >Politique de confidentialité</a
                            >
                        </p>
                        <p>
                            <a
                                href="https://github.com/aitaddajuba"
                                style="color: #4caf50"
                                >GitHub</a
                            >
                            |
                            <a
                                href="https://linkedin.com/in/aitaddajuba"
                                style="color: #4caf50"
                                >LinkedIn</a
                            >
                            |
                            <a
                                href="mailto:contact@aitaddajuba.fr"
                                style="color: #4caf50"
                                >Email</a
                            >
                        </p>
                    </footer>
                </td>
            </tr>
        </table>
    </body>
</html>
