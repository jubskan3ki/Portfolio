<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <title>📩 Nouveau message de contact</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            font-family: Lato, Roboto, sans-serif;
        "
    >
        <table
            align="center"
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
                background-color: #ffffff;
                border-radius: 12px;
                border: 2px solid #e0e0e0;
            "
        >
            <tr>
                <td style="padding: 40px">
                    <h1
                        style="
                            color: #2196f3;
                            font-size: 26px;
                            text-align: center;
                            margin: 0;
                        "
                    >
                        📬 Nouveau message de contact reçu
                    </h1>

                    <p style="font-size: 16px; color: #333333">
                        <strong>Nom :</strong> {{ name }}
                    </p>
                    <p style="font-size: 16px; color: #333333">
                        <strong>Email :</strong>
                        <a href="mailto:{{ email }}" style="color: #2196f3"
                            >{{ email }}</a
                        >
                    </p>

                    <p style="font-size: 16px; color: #333333">
                        <strong>Message :</strong>
                    </p>
                    <div
                        style="
                            background: #f1f1f1;
                            padding: 12px 20px;
                            border-left: 4px solid #2196f3;
                            font-style: italic;
                            color: #555555;
                        "
                    >
                        {{ message }}
                    </div>

                    <div style="text-align: center; margin-top: 24px">
                        <a
                            href="mailto:{{ email }}"
                            style="
                                background-color: #2196f3;
                                color: #ffffff;
                                text-decoration: none;
                                padding: 12px 28px;
                                border-radius: 6px;
                                font-weight: bold;
                                display: inline-block;
                            "
                        >
                            Répondre à {{ name }}
                        </a>
                    </div>

                    <hr
                        style="
                            margin: 40px 0;
                            border: none;
                            border-top: 1px solid #e0e0e0;
                        "
                    />

                    <footer
                        style="
                            text-align: center;
                            font-size: 12px;
                            color: #999999;
                        "
                    >
                        <p>
                            Ce message est automatique. Ne pas y répondre
                            directement.
                        </p>
                        <p>© {{ year }} Juba Aitadda. Tous droits réservés.</p>
                        <p>
                            <a
                                href="https://aitaddajuba.fr/politique-confidentialite"
                                style="color: #2196f3"
                                >Politique de confidentialité</a
                            >
                        </p>
                        <p>
                            <a
                                href="https://github.com/aitaddajuba"
                                style="color: #2196f3"
                                >GitHub</a
                            >
                            |
                            <a
                                href="https://linkedin.com/in/aitaddajuba"
                                style="color: #2196f3"
                                >LinkedIn</a
                            >
                            |
                            <a
                                href="mailto:contact@aitaddajuba.fr"
                                style="color: #2196f3"
                                >Email</a
                            >
                        </p>
                    </footer>
                </td>
            </tr>
        </table>
    </body>
</html>
