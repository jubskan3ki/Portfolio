stages:
    - build
    - test
    - deploy

# Étape 1 : Build de l'image Docker

build:
    stage: build
    image: docker:latest
    services:
        - docker:dind
    before_script:
        - docker info
    script:
        - echo "===> Build de l'image Docker en cours..."
        - docker-compose -f docker-compose.yml build

# Étape 2 : Tests backend et frontend

test-backend:
    stage: test
    image: docker:latest
    services:
        - docker:dind
        - name: postgres:17-alpine
          alias: test-db
          variables:
              POSTGRES_DB: test_portfolio
              POSTGRES_USER: test_user
              POSTGRES_PASSWORD: test_password
    before_script:
        - docker info
    script:
        - echo "===> Build de l'image backend..."
        - docker build -t portfolio-backend ./apps/server
        - echo "===> Vérification de la configuration Django..."
        - docker run --rm
          -e DB_HOST=test-db
          -e DB_PORT=5432
          -e DB_NAME=test_portfolio
          -e DB_USER=test_user
          -e DB_PASSWORD=test_password
          -e DJANGO_SECRET_KEY=test-secret-key
          -e JWT_SECRET_ACCESS_KEY=test-jwt-key
          --network host
          portfolio-backend python manage.py check
        - echo "===> Lancement des tests backend..."
        - docker run --rm
          -e DB_HOST=test-db
          -e DB_PORT=5432
          -e DB_NAME=test_portfolio
          -e DB_USER=test_user
          -e DB_PASSWORD=test_password
          -e DJANGO_SECRET_KEY=test-secret-key
          -e JWT_SECRET_ACCESS_KEY=test-jwt-key
          --network host
          portfolio-backend python -m pytest --cov=core --cov-report=term-missing

test-frontend:
    stage: test
    image: docker:latest
    services:
        - docker:dind
    before_script:
        - docker info
    script:
        - echo "===> Build de l'image frontend..."
        - docker build -t portfolio-frontend ./apps/client
        - echo "===> Vérification des types TypeScript..."
        - docker run --rm portfolio-frontend pnpm run type-check
        - echo "===> Linting ESLint..."
        - docker run --rm portfolio-frontend pnpm run lint

lint-backend:
    stage: test
    image: docker:latest
    services:
        - docker:dind
    before_script:
        - docker info
    script:
        - echo "===> Build de l'image backend..."
        - docker build -t portfolio-backend ./apps/server
        - echo "===> Vérification du formatage (Black)..."
        - docker run --rm portfolio-backend python -m black --check .
        - echo "===> Vérification des imports (isort)..."
        - docker run --rm portfolio-backend python -m isort --check-only .
        - echo "===> Linting (flake8)..."
        - docker run --rm portfolio-backend python -m flake8 .
        - echo "===> Linting (ruff)..."
        - docker run --rm portfolio-backend python -m ruff check .

# Étape 3 : Déploiement sur ton VPS via SSH

deploy:
    stage: deploy
    image: alpine:latest
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    before_script:
        - apk add --no-cache openssh-client
        - mkdir -p ~/.ssh
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
        - chmod 600 ~/.ssh/id_rsa
        - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
    script:
        - echo "===> Connexion SSH au serveur et déploiement"
        - ssh -v -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
          cd /home/$SSH_USER/projects/Portfolio/ &&
          git pull origin main &&
          chmod +x ./apps/server/scripts/setup.sh &&
          docker-compose down &&
          docker-compose up -d --build
          "
