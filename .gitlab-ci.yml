stages:
    - build
    - test
    - deploy

variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"

# ── Build ────────────────────────────────────

build-backend:
    stage: build
    image: docker:latest
    services:
        - docker:dind
    script:
        - docker build -t portfolio-backend ./apps/server
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

build-frontend:
    stage: build
    image: docker:latest
    services:
        - docker:dind
    script:
        - docker build -t portfolio-frontend ./apps/client
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

# ── Tests ────────────────────────────────────

test-backend:
    stage: test
    image: docker:latest
    services:
        - docker:dind
        - name: postgres:17-alpine
          alias: test-db
          variables:
              POSTGRES_DB: test_portfolio
              POSTGRES_USER: test_user
              POSTGRES_PASSWORD: test_password
    script:
        - docker build -t portfolio-backend ./apps/server
        - docker run --rm
          -e DB_HOST=test-db
          -e DB_PORT=5432
          -e DB_NAME=test_portfolio
          -e DB_USER=test_user
          -e DB_PASSWORD=test_password
          -e DJANGO_SECRET_KEY=test-secret-key
          -e JWT_SECRET_ACCESS_KEY=test-jwt-key
          -e ALLOWED_HOSTS=*
          --network host
          portfolio-backend python manage.py check
        - docker run --rm
          -e DB_HOST=test-db
          -e DB_PORT=5432
          -e DB_NAME=test_portfolio
          -e DB_USER=test_user
          -e DB_PASSWORD=test_password
          -e DJANGO_SECRET_KEY=test-secret-key
          -e JWT_SECRET_ACCESS_KEY=test-jwt-key
          -e ALLOWED_HOSTS=*
          --network host
          portfolio-backend python -m pytest --cov=core --cov-report=term-missing
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

lint-backend:
    stage: test
    image: docker:latest
    services:
        - docker:dind
    script:
        - docker build -t portfolio-backend ./apps/server
        - docker run --rm portfolio-backend python -m black --check .
        - docker run --rm portfolio-backend python -m isort --check-only .
        - docker run --rm portfolio-backend python -m ruff check .
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

lint-frontend:
    stage: test
    image: docker:latest
    services:
        - docker:dind
    script:
        - docker build --target builder -t portfolio-frontend-builder ./apps/client
        - docker run --rm portfolio-frontend-builder pnpm run type-check
        - docker run --rm portfolio-frontend-builder pnpm run lint
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

# ── Deploy ───────────────────────────────────

deploy:
    stage: deploy
    image: alpine:latest
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    before_script:
        - apk add --no-cache openssh-client
        - mkdir -p ~/.ssh
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
        - chmod 600 ~/.ssh/id_rsa
        - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
    script:
        - scp -P "$SSH_PORT" "$ENV_FILE" "$SSH_USER@$SSH_HOST:/home/$SSH_USER/projects/Portfolio/.env"
        - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
          cd /home/$SSH_USER/projects/Portfolio &&
          git pull origin main &&
          docker compose down &&
          docker compose up -d --build &&
          docker compose ps
          "
