stages:
    - validate
    - test
    - security
    - build
    - sbom
    - perf
    - deploy

workflow:
    rules:
        - if: $CI_PIPELINE_SOURCE == "trigger"
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
          when: never
        - if: $CI_PIPELINE_SOURCE == "schedule"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
    PYTHON_VERSION: "3.14"
    NODE_VERSION: "24"
    BUN_VERSION: "1.3"
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
    FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

.rules:all:
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

.rules:main_or_develop:
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

.rules:main:
    rules:
        - if: $CI_COMMIT_BRANCH == "main"

.python_cache:
    cache:
        key: "python-${PYTHON_VERSION}-${CI_COMMIT_REF_SLUG}"
        paths:
            - .pip-cache
        policy: pull-push

.node_cache:
    cache:
        key: "bun-${BUN_VERSION}-${CI_COMMIT_REF_SLUG}"
        paths:
            - .bun-cache
            - apps/client/node_modules
        policy: pull-push

.backend_base:
    image: python:${PYTHON_VERSION}-slim
    extends: .python_cache
    before_script:
        - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libffi-dev libjpeg-dev zlib1g-dev
        - pip install --cache-dir $PIP_CACHE_DIR --quiet -r apps/server/requirements.txt

.frontend_base:
    image: oven/bun:${BUN_VERSION}-alpine
    extends: .node_cache
    before_script:
        - cd apps/client && bun install --frozen-lockfile && cd -

.docker_base:
    image: docker:latest
    services:
        - docker:dind
    variables:
        DOCKER_BUILDKIT: "1"
        DOCKER_TLS_CERTDIR: ""
        DOCKER_HOST: tcp://docker:2375
    before_script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

validate:backend:format:
    stage: validate
    extends: [.backend_base, .rules:all]
    script:
        - cd apps/server
        - python -m black --check .
        - python -m isort --check-only .

validate:backend:lint:
    stage: validate
    extends: [.backend_base, .rules:all]
    script:
        - cd apps/server && python -m ruff check .

validate:backend:types:
    stage: validate
    extends: [.backend_base, .rules:all]
    variables:
        DJANGO_SECRET_KEY: ci-secret-key-not-for-production
        JWT_SECRET_ACCESS_KEY: ci-jwt-key-not-for-production
        ALLOWED_HOSTS: "*"
        DJANGO_DEBUG: "false"
        DB_HOST: localhost
        DB_PORT: "5432"
        DB_NAME: ci
        DB_USER: ci
        DB_PASSWORD: ci
        SMTP_USER: ci
        SMTP_PASS: ci
        EMAIL_FROM: ci@ci.local
        ADMIN_EMAIL: ci@ci.local
        ADMIN_PASSWORD: ci
    script:
        - cd apps/server && python -m mypy .
    allow_failure: true # advisory : les erreurs remontent sans bloquer le pipeline

validate:frontend:types:
    stage: validate
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && bun run type-check

validate:frontend:lint:
    stage: validate
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && bun run lint

validate:frontend:css:
    stage: validate
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && bun run lint:css

test:backend:unit:
    stage: test
    image: python:${PYTHON_VERSION}-slim
    extends: [.python_cache, .rules:all]
    services:
        - name: timescale/timescaledb:2.18.2-pg17
          alias: test-db
          variables:
              POSTGRES_DB: test_portfolio
              POSTGRES_USER: test_user
              POSTGRES_PASSWORD: test_password
              TIMESCALEDB_TELEMETRY: "off"
    variables:
        DB_HOST: test-db
        TEST_DB_HOST: test-db
        DB_PORT: "5432"
        DB_NAME: test_portfolio
        DB_USER: test_user
        DB_PASSWORD: test_password
        DJANGO_SECRET_KEY: ci-secret-key-not-for-production
        JWT_SECRET_ACCESS_KEY: ci-jwt-key-not-for-production
        ALLOWED_HOSTS: "*"
        DJANGO_DEBUG: "false"
        CELERY_TASK_ALWAYS_EAGER: "true"
        POSTGRES_HOST_AUTH_METHOD: trust
    before_script:
        - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libffi-dev libjpeg-dev zlib1g-dev
        - pip install --cache-dir $PIP_CACHE_DIR --quiet -r apps/server/requirements.txt
    script:
        - cd apps/server
        - python -m pytest
          --cov=core
          --cov=utils
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -n auto
          -v
          --tb=short
          -x
    coverage: '/TOTAL.*\s+(\d+%)$/'
    artifacts:
        when: always
        reports:
            coverage_report:
                coverage_format: cobertura
                path: apps/server/coverage.xml
        expire_in: 1 week

test:frontend:unit:
    stage: test
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && bun run test

security:backend:bandit:
    stage: security
    image: python:${PYTHON_VERSION}-slim
    extends: [.python_cache, .rules:all]
    before_script:
        - pip install --cache-dir $PIP_CACHE_DIR --quiet bandit
    script:
        - bandit -r apps/server
          -x apps/server/tests,apps/server/migrations
          --severity-level medium
          --confidence-level medium
          -q
    allow_failure: true # advisory: bandit has many false positives in Django code

security:backend:pip-audit:
    stage: security
    image: python:${PYTHON_VERSION}-slim
    extends: [.python_cache, .rules:all]
    before_script:
        - pip install --cache-dir $PIP_CACHE_DIR --quiet pip-audit
    script:
        - pip-audit --requirement apps/server/requirements.txt --skip-editable
    allow_failure: false # blocking: CVE in a pinned dep means bump or accept in .trivyignore

security:frontend:audit:
    stage: security
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && bun audit --audit-level=high
    allow_failure: false # blocking: high-severity npm CVE blocks merge

security:gitleaks:
    stage: security
    image:
        name: zricethezav/gitleaks:latest
        entrypoint: [""]
    extends: .rules:all
    script:
        - gitleaks detect --source . --verbose --no-git --redact
    allow_failure: false # blocking: any leaked secret fails the pipeline

security:trivy:fs:
    stage: security
    image:
        name: ghcr.io/aquasecurity/trivy:latest
        entrypoint: [""]
    extends: .rules:all
    variables:
        TRIVY_NO_PROGRESS: "true"
        TRIVY_CACHE_DIR: ".trivycache/"
    cache:
        key: trivy
        paths:
            - .trivycache/
    script:
        - trivy fs
          --scanners vuln,misconfig,secret
          --exit-code 1
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile .trivyignore
          .
    allow_failure: false

# Build tags: $SHORT_SHA (canonical), $REF_SLUG (branch-friendly), latest (main only).
.build_image:
    stage: build
    extends: .docker_base
    variables:
        IMAGE: ""
        CONTEXT: ""
    script:
        - BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        - docker buildx create --use --name portfolio-builder --driver docker-container --bootstrap
        - |
            TAGS="-t $IMAGE:$IMAGE_TAG -t $IMAGE:$CI_COMMIT_REF_SLUG"
            if [ "$CI_COMMIT_BRANCH" = "main" ]; then
                TAGS="$TAGS -t $IMAGE:latest"
            fi
        - docker buildx build
          --push
          --cache-from type=registry,ref=$IMAGE:buildcache
          --cache-to type=registry,ref=$IMAGE:buildcache,mode=max
          --build-arg VCS_REF=$CI_COMMIT_SHA
          --build-arg BUILD_DATE=$BUILD_DATE
          $TAGS
          $CONTEXT

build:backend:
    extends: .build_image
    variables:
        IMAGE: $BACKEND_IMAGE
        CONTEXT: ./apps/server
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - apps/server/**/*
              - docker-compose.yml

build:frontend:
    extends: .build_image
    variables:
        IMAGE: $FRONTEND_IMAGE
        CONTEXT: ./apps/client
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - apps/client/**/*
              - docker-compose.yml

.trivy_image_base:
    stage: build
    image:
        name: ghcr.io/aquasecurity/trivy:latest
        entrypoint: [""]
    variables:
        TRIVY_NO_PROGRESS: "true"
        TRIVY_USERNAME: $CI_REGISTRY_USER
        TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    before_script:
        - trivy --version

security:trivy:image:backend:
    extends: .trivy_image_base
    needs:
        - job: build:backend
    script:
        - trivy image
          --exit-code 1
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile .trivyignore
          $BACKEND_IMAGE:$IMAGE_TAG
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

security:trivy:image:frontend:
    extends: .trivy_image_base
    needs:
        - job: build:frontend
    script:
        - trivy image
          --exit-code 1
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --ignorefile .trivyignore
          $FRONTEND_IMAGE:$IMAGE_TAG
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

# SBOM (SPDX JSON) via syft, retained 1 year for downstream CVE scanning.
.sbom_base:
    stage: sbom
    image: alpine:latest
    extends: .rules:main_or_develop
    variables:
        SYFT_REGISTRY_AUTH_AUTHORITY: $CI_REGISTRY
        SYFT_REGISTRY_AUTH_USERNAME: $CI_REGISTRY_USER
        SYFT_REGISTRY_AUTH_PASSWORD: $CI_REGISTRY_PASSWORD
    before_script:
        - apk add --no-cache curl ca-certificates
        - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

sbom:backend:
    extends: .sbom_base
    needs:
        - job: build:backend
    script:
        - syft "$BACKEND_IMAGE:$IMAGE_TAG" -o spdx-json=sbom-backend.spdx.json
    artifacts:
        paths:
            - sbom-backend.spdx.json
        expire_in: 1 year

sbom:frontend:
    extends: .sbom_base
    needs:
        - job: build:frontend
    script:
        - syft "$FRONTEND_IMAGE:$IMAGE_TAG" -o spdx-json=sbom-frontend.spdx.json
    artifacts:
        paths:
            - sbom-frontend.spdx.json
        expire_in: 1 year

# Cosign keyless signing: OIDC token from GitLab is exchanged for an ephemeral
# Fulcio cert (Sigstore), signature + SBOM attestation pushed alongside the image.
# Verify with: cosign verify --certificate-identity-regexp ".*/portfolio.*" \
#   --certificate-oidc-issuer https://gitlab.com IMAGE
.cosign_base:
    stage: sbom
    image: alpine:latest
    extends: .rules:main_or_develop
    id_tokens:
        SIGSTORE_ID_TOKEN:
            aud: sigstore
    variables:
        COSIGN_VERSION: v2.4.1
        COSIGN_YES: "true"
    before_script:
        - apk add --no-cache curl ca-certificates
        - curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
        - chmod +x /usr/local/bin/cosign
        - echo "$CI_REGISTRY_PASSWORD" | cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

sign:backend:
    extends: .cosign_base
    needs:
        - job: build:backend
        - job: sbom:backend
          artifacts: true
    script:
        - cosign sign "$BACKEND_IMAGE:$IMAGE_TAG"
        - cosign attest --predicate sbom-backend.spdx.json --type spdxjson "$BACKEND_IMAGE:$IMAGE_TAG"

sign:frontend:
    extends: .cosign_base
    needs:
        - job: build:frontend
        - job: sbom:frontend
          artifacts: true
    script:
        - cosign sign "$FRONTEND_IMAGE:$IMAGE_TAG"
        - cosign attest --predicate sbom-frontend.spdx.json --type spdxjson "$FRONTEND_IMAGE:$IMAGE_TAG"

perf:k6:nightly:
    stage: perf
    image:
        name: grafana/k6:latest
        entrypoint: [""]
    rules:
        - if: $CI_PIPELINE_SOURCE == "schedule"
    variables:
        BASE_URL: $K6_BASE_URL # defined as CI schedule variable (e.g. https://aitaddajuba.fr)
    script:
        - echo ">> k6 browse scenario against $BASE_URL"
        - k6 run --env BASE_URL=$BASE_URL bench/scenarios/browse.js --summary-export=k6-browse-summary.json
        - echo ">> k6 sustained (shorter in CI | 5 min)"
        - k6 run --env BASE_URL=$BASE_URL --duration 5m bench/scenarios/sustained.js --summary-export=k6-sustained-summary.json
    artifacts:
        when: always
        paths:
            - k6-*-summary.json
        expire_in: 30 days
    allow_failure: false

perf:lighthouse:
    stage: perf
    image: node:24-bookworm-slim
    extends: [.node_cache, .rules:main_or_develop]
    variables:
        NUXT_PUBLIC_API_BASE: "http://localhost:8000"
        NUXT_API_BASE_SERVER: "http://localhost:8000"
        NODE_OPTIONS: "--max-old-space-size=4096"
    before_script:
        - apt-get update -qq && apt-get install -y -qq chromium curl unzip
        - curl -fsSL https://bun.sh/install | bash
        - export PATH="$HOME/.bun/bin:$PATH"
        - export CHROME_PATH=$(which chromium)
        - cd apps/client && bun install --frozen-lockfile && cd -
    script:
        - export PATH="$HOME/.bun/bin:$PATH"
        - cd apps/client && bun run build && bun run lighthouse:ci
    artifacts:
        paths:
            - apps/client/.lighthouseci/
        expire_in: 2 weeks
    allow_failure: true

# Deploy pulls the pinned image and runs a rolling (zero-downtime) rollout; rollback is manual.
.ssh_base:
    image: alpine:latest
    before_script:
        - apk add --no-cache openssh-client curl
        - mkdir -p ~/.ssh
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
        - chmod 600 ~/.ssh/id_rsa
        - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

deploy:production:
    stage: deploy
    extends: .ssh_base
    environment:
        name: production
        url: https://$DEPLOY_DOMAIN
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    needs:
        - job: test:backend:unit
        - job: validate:backend:format
        - job: validate:backend:lint
        - job: validate:frontend:types
        - job: validate:frontend:lint
        - job: security:gitleaks
        - job: security:trivy:fs
        - job: security:trivy:image:backend
        - job: security:trivy:image:frontend
        - job: build:backend
        - job: build:frontend
    script:
        # Record previous IMAGE_TAG so deploy:rollback can restore it.
        - |
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
                cd $DEPLOY_PATH
                if [ -f .current-image-tag ]; then
                    cp .current-image-tag .previous-image-tag
                fi
                echo '$IMAGE_TAG' > .current-image-tag
            "
        - wget -q https://github.com/getsops/sops/releases/download/v3.9.1/sops-v3.9.1.linux.amd64 -O /usr/local/bin/sops
        - chmod +x /usr/local/bin/sops
        - mkdir -p ~/.config/sops/age
        - echo "$SOPS_AGE_KEY" > ~/.config/sops/age/keys.txt
        - chmod 600 ~/.config/sops/age/keys.txt
        - sops --decrypt --input-type yaml --output-type dotenv secrets/prod.env.sops.yaml > /tmp/prod.env
        - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH/secrets && chmod 700 $DEPLOY_PATH/secrets"
        - scp -P "$SSH_PORT" /tmp/prod.env "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/secrets/prod.env"
        - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "chmod 600 $DEPLOY_PATH/secrets/prod.env"
        - rm -f /tmp/prod.env
        - |
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
                set -e
                echo '$CI_JOB_TOKEN' | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
                cd $DEPLOY_PATH
                git fetch $CI_REPOSITORY_URL main
                git reset --hard $CI_COMMIT_SHA
                export IMAGE_TAG=$IMAGE_TAG
                export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
                export SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets
                make deploy-zd ENV=prod IMAGE_TAG=$IMAGE_TAG CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets
                make status ENV=prod CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets
            "

deploy:smoke-test:
    stage: deploy
    extends: .ssh_base
    environment:
        name: production
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    needs:
        - job: deploy:production
    script:
        - |
            echo ">> Smoke test: wait for services to be healthy..."
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
                cd $DEPLOY_PATH
                export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
                export SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets
                for i in \$(seq 1 30); do
                    make healthcheck ENV=prod CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets 2>&1 | tee /tmp/hc.log
                    grep -qiE 'https?://.*: 200' /tmp/hc.log && break
                    sleep 3
                done
            "
        - |
            echo ">> Smoke test: external HTTPS..."
            curl -fsSL --max-time 10 -o /dev/null -w "https /: %{http_code}\n" \
                "https://$DEPLOY_DOMAIN/"
            curl -fsSL --max-time 10 -o /dev/null -w "https /health: %{http_code}\n" \
                "https://$DEPLOY_DOMAIN/health"

deploy:rollback:
    stage: deploy
    extends: .ssh_base
    environment:
        name: production
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
          when: manual
          allow_failure: true
    needs:
        - job: deploy:production
          optional: true
    script:
        - |
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
                set -e
                echo '$CI_JOB_TOKEN' | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
                cd $DEPLOY_PATH
                export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
                export SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets
                test -s .previous-image-tag || { echo 'no .previous-image-tag | nothing to roll back to'; exit 1; }
                prev=\$(cat .previous-image-tag)
                echo 'Rollback to' \$prev
                make rollback ENV=prod TAG=\$prev CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets
                make healthcheck ENV=prod CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE SECRETS_RUNTIME_DIR=$DEPLOY_PATH/secrets
            "
