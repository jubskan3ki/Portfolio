stages:
    - validate
    - test
    - security
    - build
    - perf
    - deploy

workflow:
    rules:
        - if: $CI_PIPELINE_SOURCE == "trigger"
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
          when: never
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"
    PYTHON_VERSION: "3.14"
    NODE_VERSION: "24"
    PNPM_VERSION: "10.28.0"

# ── Règles réutilisables ──────────────────────────────────────────────────────

.rules:all:
    rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

.rules:main_or_develop:
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"

# ── Templates de cache ────────────────────────────────────────────────────────

.python_cache:
    cache:
        key: "python-${PYTHON_VERSION}-${CI_COMMIT_REF_SLUG}"
        paths:
            - .pip-cache
        policy: pull-push

.node_cache:
    cache:
        key: "pnpm-${NODE_VERSION}-${CI_COMMIT_REF_SLUG}"
        paths:
            - .pnpm-store
            - apps/client/node_modules
        policy: pull-push

# ── Templates de base ─────────────────────────────────────────────────────────

.backend_base:
    image: python:${PYTHON_VERSION}-slim
    extends: .python_cache
    before_script:
        - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libffi-dev libjpeg-dev zlib1g-dev
        - pip install --cache-dir $PIP_CACHE_DIR --quiet -r apps/server/requirements.txt

.frontend_base:
    image: node:${NODE_VERSION}-alpine
    extends: .node_cache
    before_script:
        - corepack enable pnpm
        - pnpm --dir apps/client install --frozen-lockfile --store-dir $PNPM_STORE_PATH

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — validate (jobs parallèles, rapides)
# ══════════════════════════════════════════════════════════════════════════════

validate:backend:format:
    stage: validate
    extends: [.backend_base, .rules:all]
    script:
        - cd apps/server
        - python -m black --check .
        - python -m isort --check-only .

validate:backend:lint:
    stage: validate
    extends: [.backend_base, .rules:all]
    script:
        - cd apps/server && python -m ruff check .

validate:backend:types:
    stage: validate
    extends: [.backend_base, .rules:all]
    variables:
        DJANGO_SECRET_KEY: ci-secret-key-not-for-production
        JWT_SECRET_ACCESS_KEY: ci-jwt-key-not-for-production
        ALLOWED_HOSTS: "*"
        DJANGO_DEBUG: "false"
        DB_HOST: localhost
        DB_PORT: "5432"
        DB_NAME: ci
        DB_USER: ci
        DB_PASSWORD: ci
        SMTP_USER: ci
        SMTP_PASS: ci
        EMAIL_FROM: ci@ci.local
        ADMIN_EMAIL: ci@ci.local
        ADMIN_PASSWORD: ci
    script:
        - cd apps/server && python -m mypy .
    allow_failure: true  # advisory : les erreurs remontent sans bloquer le pipeline

validate:frontend:types:
    stage: validate
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && pnpm type-check

validate:frontend:eslint:
    stage: validate
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && pnpm lint

validate:frontend:css:
    stage: validate
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && pnpm lint:css

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 2 — test
# ══════════════════════════════════════════════════════════════════════════════

test:backend:unit:
    stage: test
    image: python:${PYTHON_VERSION}-slim
    extends: [.python_cache, .rules:all]
    services:
        - name: postgres:17-alpine
          alias: test-db
          variables:
              POSTGRES_DB: test_portfolio
              POSTGRES_USER: test_user
              POSTGRES_PASSWORD: test_password
    variables:
        DB_HOST: test-db
        DB_PORT: "5432"
        DB_NAME: test_portfolio
        DB_USER: test_user
        DB_PASSWORD: test_password
        DJANGO_SECRET_KEY: ci-secret-key-not-for-production
        JWT_SECRET_ACCESS_KEY: ci-jwt-key-not-for-production
        ALLOWED_HOSTS: "*"
        DJANGO_DEBUG: "false"
        CELERY_TASK_ALWAYS_EAGER: "true"
    before_script:
        - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libffi-dev libjpeg-dev zlib1g-dev
        - pip install --cache-dir $PIP_CACHE_DIR --quiet -r apps/server/requirements.txt
    script:
        - cd apps/server
        - python -m pytest
          --cov=core
          --cov=utils
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -n auto
          -v
          --tb=short
          -x
    coverage: '/TOTAL.*\s+(\d+%)$/'
    artifacts:
        when: always
        reports:
            coverage_report:
                coverage_format: cobertura
                path: apps/server/coverage.xml
        expire_in: 1 week

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 3 — security
# ══════════════════════════════════════════════════════════════════════════════

security:backend:bandit:
    stage: security
    image: python:${PYTHON_VERSION}-slim
    extends: [.python_cache, .rules:all]
    before_script:
        - pip install --cache-dir $PIP_CACHE_DIR --quiet bandit
    script:
        - bandit -r apps/server
          -x apps/server/tests,apps/server/migrations
          --severity-level medium
          --confidence-level medium
          -q
    allow_failure: true

security:backend:pip-audit:
    stage: security
    image: python:${PYTHON_VERSION}-slim
    extends: [.python_cache, .rules:all]
    before_script:
        - pip install --cache-dir $PIP_CACHE_DIR --quiet pip-audit
    script:
        - pip-audit --requirement apps/server/requirements.txt --skip-editable --ignore-vuln CVE-2026-4539  # pygments: no fix available yet
    allow_failure: true

security:frontend:audit:
    stage: security
    extends: [.frontend_base, .rules:all]
    script:
        - cd apps/client && pnpm audit --audit-level=high
    allow_failure: true

security:trivy:
    stage: security
    image:
        name: ghcr.io/aquasecurity/trivy:latest
        entrypoint: [""]
    extends: .rules:all
    script:
        - trivy fs --scanners vuln
          --exit-code 1
          --severity HIGH,CRITICAL
          --no-progress
          --ignore-unfixed
          .
        - trivy config
          --exit-code 0
          --severity HIGH,CRITICAL
          apps/server/Dockerfile apps/client/Dockerfile
    allow_failure: true

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 4 — build (BuildKit activé — uniquement main/develop ou changements Docker)
# ══════════════════════════════════════════════════════════════════════════════

build:backend:
    stage: build
    image: docker:latest
    services:
        - docker:dind
    variables:
        DOCKER_BUILDKIT: "1"
    script:
        - docker build -t portfolio-backend ./apps/server
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - apps/server/**/*
              - docker-compose.yml

build:frontend:
    stage: build
    image: docker:latest
    services:
        - docker:dind
    variables:
        DOCKER_BUILDKIT: "1"
    script:
        - docker build -t portfolio-frontend ./apps/client
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_COMMIT_BRANCH == "develop"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
              - apps/client/**/*
              - docker-compose.yml

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 5 — perf (Lighthouse CI — main/develop uniquement)
# ══════════════════════════════════════════════════════════════════════════════

perf:lighthouse:
    stage: perf
    image: node:24
    extends: [.node_cache, .rules:main_or_develop]
    variables:
        NUXT_PUBLIC_API_BASE: "http://localhost:8000"
        NUXT_API_BASE_SERVER: "http://localhost:8000"
        NODE_OPTIONS: "--max-old-space-size=4096"
    before_script:
        - apt-get update -qq && apt-get install -y -qq chromium
        - export CHROME_PATH=$(which chromium)
        - corepack enable pnpm
        - pnpm --dir apps/client install --frozen-lockfile --store-dir $PNPM_STORE_PATH
    script:
        - cd apps/client && pnpm build && pnpm lighthouse:ci
    artifacts:
        paths:
            - apps/client/.lighthouseci/
        expire_in: 2 weeks
    allow_failure: true

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 6 — deploy (main uniquement)
# ══════════════════════════════════════════════════════════════════════════════

deploy:production:
    stage: deploy
    image: alpine:latest
    environment:
        name: production
        url: https://$SSH_HOST
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
    needs:
        - job: test:backend:unit
        - job: validate:backend:format
        - job: validate:backend:lint
        - job: validate:frontend:types
        - job: validate:frontend:eslint
        - job: build:backend
        - job: build:frontend
    before_script:
        - apk add --no-cache openssh-client
        - mkdir -p ~/.ssh
        - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
        - chmod 600 ~/.ssh/id_rsa
        - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
    script:
        - scp -P "$SSH_PORT" "$ENV_FILE" "$SSH_USER@$SSH_HOST:/home/$SSH_USER/projects/Portfolio/.env"
        - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
          cd /home/$SSH_USER/projects/Portfolio &&
          git pull origin main &&
          docker compose pull 2>/dev/null || true &&
          docker compose up -d --build &&
          docker compose ps
          "
