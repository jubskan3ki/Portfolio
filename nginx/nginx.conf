# =============================================================================
# Server Block — Ultra-optimized for Performance & Security
# Mounted at /etc/nginx/conf.d/default.conf
# =============================================================================

# --- Upstreams with keepalive ---
upstream backend {
    server backend:8000;
    keepalive 8;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# --- API response cache ---
proxy_cache_path /var/cache/nginx/api
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=10m
    use_temp_path=off;

# --- Rate limiting zones ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:5m rate=2r/s;
limit_req_zone $binary_remote_addr zone=contact_limit:5m rate=1r/m;
limit_req_status 429;

# --- Cache bypass map ---
map $http_authorization $no_cache {
    default 0;
    ~.+     1;
}

# --- Real IP (Docker + cloud LB) ---
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    # =========================================================================
    # GZIP COMPRESSION
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/vnd.ms-fontobject
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # =========================================================================
    # SECURITY HEADERS (server-level baseline)
    # NOTE: Any location using add_header MUST repeat these (nginx inheritance)
    # =========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "0" always;

    # =========================================================================
    # CLIENT SETTINGS
    # =========================================================================
    client_max_body_size 10m;

    # =========================================================================
    # PROXY BUFFERING DEFAULTS
    # =========================================================================
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_request_buffering on;

    # =========================================================================
    # BLOCK HIDDEN FILES (.git, .env, .htaccess, etc.)
    # =========================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # HEALTH CHECK (lightweight, no upstream hit)
    # =========================================================================
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # =========================================================================
    # DJANGO STATIC FILES (served directly by Nginx)
    # =========================================================================
    location /static/ {
        alias /app/staticfiles/;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        gzip_static on;
        etag on;
        if_modified_since exact;
        access_log off;
    }

    # =========================================================================
    # MEDIA FILES (user uploads)
    # =========================================================================
    location /media/ {
        alias /app/media/;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        access_log off;

        # Block script execution in uploads
        location ~* \.(php|py|pl|cgi|sh|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # =========================================================================
    # CONTACT FORM (strict rate limit)
    # =========================================================================
    location /api/contacts/ {
        limit_req zone=contact_limit burst=3 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_cache off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # =========================================================================
    # API PROXY (with caching + rate limiting)
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Proxy cache for anonymous GET requests
        proxy_cache api_cache;
        proxy_cache_methods GET;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 304 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $no_cache $cookie_sessionid;
        proxy_no_cache $no_cache $cookie_sessionid;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # =========================================================================
    # DJANGO ADMIN (rate limited, no cache, noindex)
    # =========================================================================
    location /django-admin/ {
        limit_req zone=admin_limit burst=5 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache off;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # =========================================================================
    # NUXT ADMIN (noindex — defense-in-depth alongside robots.txt)
    # =========================================================================
    location /admin {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # =========================================================================
    # PROMETHEUS METRICS
    # =========================================================================
    location /metrics {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # =========================================================================
    # NUXT HASHED ASSETS (immutable, Brotli passthrough)
    # =========================================================================
    location /_nuxt/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding $http_accept_encoding;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        access_log off;
    }

    # =========================================================================
    # NUXT STATIC ASSETS (fonts, images — immutable cache)
    # =========================================================================
    location ~ ^/(fonts|images)/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding $http_accept_encoding;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        access_log off;
    }

    # =========================================================================
    # FAVICON, ROBOTS, SITEMAP (1 day cache)
    # =========================================================================
    location ~* ^/(favicon\.ico|favicon\.svg|logo\.svg|robots\.txt|sitemap.*\.xml)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding $http_accept_encoding;

        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        access_log off;
    }

    # =========================================================================
    # FRONTEND — Nuxt SSR (catch-all, Brotli passthrough)
    # =========================================================================
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding $http_accept_encoding;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # CUSTOM ERROR PAGES
    # =========================================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
