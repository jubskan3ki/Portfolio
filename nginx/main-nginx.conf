# =============================================================================
# Main Nginx Configuration — Performance Tuning
# Mounted at /etc/nginx/nginx.conf (replaces Alpine default)
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    # --- MIME types ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Performance fundamentals ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --- Keepalive ---
    keepalive_timeout 65;
    keepalive_requests 1000;

    # --- Hash tables ---
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # --- Open file cache (avoids repeated stat()/open() syscalls) ---
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- Request body limits (defense in depth) ---
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # --- Hide Nginx version ---
    server_tokens off;

    # --- Structured log format (Promtail/Loki compatible) ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time '
                    'cs=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --- Include server blocks ---
    include /etc/nginx/conf.d/*.conf;
}
