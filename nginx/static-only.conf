# Minimal nginx serving /static/ and /media/ behind Traefik (no HTTP file provider in Traefik).
worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        server_name _;
        access_log off;

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain always;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            gzip_static on;
            etag on;
            if_modified_since exact;
        }

        location /media/ {
            alias /app/media/;
            expires 1y;
            add_header Cache-Control "public, immutable" always;

            # Defense in depth: never execute scripts from user uploads.
            location ~* \.(php|py|pl|cgi|sh|asp|aspx|jsp)$ {
                deny all;
            }
        }

        # Catch-all: actual routing handled upstream by Traefik.
        location / {
            return 404;
        }
    }
}
