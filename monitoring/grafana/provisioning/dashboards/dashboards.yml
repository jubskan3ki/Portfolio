apiVersion: 1

providers:
    - name: "Default"
      orgId: 1
      folder: ""
      folderUid: ""
      type: file
      # Dashboards are code: no UI edits, prevents drift with on-disk JSON.
      disableDeletion: true
      editable: false
      allowUiUpdates: false
      updateIntervalSeconds: 30
      options:
          path: /var/lib/grafana/dashboards
