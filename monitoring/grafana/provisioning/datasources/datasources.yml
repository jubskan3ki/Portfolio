apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          timeInterval: "15s"
          httpMethod: POST
          exemplarTraceIdDestinations:
              - datasourceUid: tempo
                name: trace_id

    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: false
      jsonData:
          maxLines: 1000
          derivedFields:
              - datasourceUid: prometheus
                matcherRegex: "container=([^,]+)"
                name: Container
                url: ""
              - datasourceUid: tempo
                matcherRegex: "trace_id=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"

    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo:3200
      editable: false
      jsonData:
          tracesToLogsV2:
              datasourceUid: loki
              filterByTraceID: true
              tags: [{ key: "service.name", value: "service_name" }]
          serviceMap:
              datasourceUid: prometheus
          search:
              hide: false
          nodeGraph:
              enabled: true

    - name: Alertmanager
      type: alertmanager
      access: proxy
      url: http://alertmanager:9093
      editable: false
      jsonData:
          implementation: prometheus

    - name: TimescaleDB
      type: postgres
      uid: timescaledb
      access: proxy
      # On pointe le service `db` direct (pas pgbouncer) car TimescaleDB introspection
      # utilise des fonctions/vues qui requièrent une session stable.
      url: db:5432
      user: ${DB_USER}
      secureJsonData:
          password: ${DB_PASSWORD}
      jsonData:
          database: ${DB_NAME}
          sslmode: disable
          maxOpenConns: 4
          maxIdleConns: 2
          connMaxLifetime: 14400
          postgresVersion: 1700
          timescaledb: true
      editable: false
