apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          timeInterval: "15s"
          httpMethod: POST
          exemplarTraceIdDestinations:
              - datasourceUid: tempo
                name: trace_id

    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: false
      jsonData:
          maxLines: 1000
          derivedFields:
              - datasourceUid: prometheus
                matcherRegex: "container=([^,]+)"
                name: Container
                url: ""
              - datasourceUid: tempo
                matcherRegex: "trace_id=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"

    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo:3200
      editable: false
      jsonData:
          tracesToLogsV2:
              datasourceUid: loki
              filterByTraceID: true
              tags: [{ key: "service.name", value: "service_name" }]
          serviceMap:
              datasourceUid: prometheus
          search:
              hide: false
          nodeGraph:
              enabled: true

    - name: Alertmanager
      type: alertmanager
      access: proxy
      url: http://alertmanager:9093
      editable: false
      jsonData:
          implementation: prometheus
