global:
    resolve_timeout: 5m

route:
    receiver: null-receiver
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

inhibit_rules:
    - source_matchers:
          - severity="page"
      target_matchers:
          - severity="ticket"
      equal: [alertname, slo]

receivers:
    - name: null-receiver
