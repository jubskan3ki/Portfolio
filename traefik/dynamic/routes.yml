http:
    services:
        backend:
            loadBalancer:
                servers:
                    - url: "http://backend:8000"
                healthCheck:
                    path: /health
                    interval: 10s
                    timeout: 3s

        frontend:
            loadBalancer:
                servers:
                    - url: "http://frontend:80"
                healthCheck:
                    path: /health
                    interval: 10s
                    timeout: 3s

        static-files:
            loadBalancer:
                servers:
                    - url: "http://nginx-static:80"
                healthCheck:
                    path: /healthz
                    interval: 30s

    routers:
        # Dashboard Traefik : sous-domaine dédié (auto-cert)
        traefik-dashboard:
            rule: "Host(`traefik.aitaddajuba.fr`)"
            entryPoints: [websecure]
            service: api@internal
            middlewares: [dashboard-auth@file, security-headers@file]
            priority: 200
            tls:
                certResolver: letsencrypt

        contacts:
            rule: "(Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)) && PathPrefix(`/api/contacts/`)"
            entryPoints: [websecure]
            service: backend
            middlewares: [contact-ratelimit@file, security-headers@file]
            priority: 100
            tls:
                certResolver: letsencrypt

        djadmin:
            rule: "(Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)) && PathPrefix(`/django-admin/`)"
            entryPoints: [websecure]
            service: backend
            middlewares: [admin-ratelimit@file, admin-noindex@file, cache-none@file, security-headers@file]
            priority: 90
            tls:
                certResolver: letsencrypt

        metrics:
            rule: "(Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)) && Path(`/metrics`)"
            entryPoints: [websecure]
            service: backend
            tls:
                certResolver: letsencrypt

        api:
            rule: "(Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)) && PathPrefix(`/api/`)"
            entryPoints: [websecure]
            service: backend
            middlewares: [api-ratelimit@file, security-headers@file, compress@file]
            priority: 50
            tls:
                certResolver: letsencrypt

        static:
            rule: "(Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)) && (PathPrefix(`/static/`) || PathPrefix(`/media/`))"
            entryPoints: [websecure]
            service: static-files
            middlewares: [cache-longterm@file, security-headers@file, compress@file]
            priority: 40
            tls:
                certResolver: letsencrypt

        nuxt-assets:
            rule: "(Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)) && PathPrefix(`/_nuxt/`)"
            entryPoints: [websecure]
            service: frontend
            middlewares: [cache-longterm@file, security-headers@file, compress@file]
            priority: 30
            tls:
                certResolver: letsencrypt

        nuxt-admin:
            rule: "(Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)) && PathPrefix(`/admin`)"
            entryPoints: [websecure]
            service: frontend
            middlewares: [admin-noindex@file, cache-none@file, security-headers@file, compress@file]
            priority: 20
            tls:
                certResolver: letsencrypt

        # Catch-all Nuxt : apex + www
        nuxt:
            rule: "Host(`aitaddajuba.fr`) || Host(`www.aitaddajuba.fr`)"
            entryPoints: [websecure]
            service: frontend
            middlewares: [security-headers@file, compress@file]
            priority: 1
            tls:
                certResolver: letsencrypt
